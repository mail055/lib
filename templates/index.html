<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lib</title>
    <link rel="icon" href="../static/favicon.ico"/>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="sidebar">
        <input type="text" class="search-bar" placeholder="Search Albums">
        <hr class="separator">
        <div class="album-list">
            {{ range .Albums }}
                <a href="/album?id={{ .ID }}" class="album-item">
                    <div class="album-cover">
                        <img src="{{ .ImageURL }}" alt="{{ .Title }}">
                    </div>
                    <div class="album-details">
                        <div class="album-title">{{ .Title }}</div>
                        <div class="album-artist">{{ .Artists }}</div>
                    </div>
                </a>
            {{ else }}
                <p class="no-albums">No albums found</p>
            {{ end }}
        </div>
    </div>
    <div class="content">
        <div class="metadata">
            <div class="album-cover">
                <img src="https://i.scdn.co/image/ab67616d0000b273de3c04b5fc750b68899b20a9" alt="In Rainbows">
            </div>
            <div class="album-info">
                <div class="album-type">Album</div>
                <div class="album-title">In Rainbows</div>
                <div class="album-artist">Radiohead • 2007 • 10 songs • 42 min 38 sec</div>
            </div>
        </div>
        <div class="tracks">
            
        </div>
    </div>
</body>
</html>
