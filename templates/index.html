<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lib</title>
    <link rel="icon" href="./static/favicon.ico"/>
    <link rel="stylesheet" href="./static/style.css">
    <script src="./static/htmx.min.js" defer></script>
    <script>
        document.addEventListener("keydown", function (e) {
            if (e.key !== "/") return;

            const tag = document.activeElement.tagName;
            if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement.isContentEditable) return;

            e.preventDefault();
            const search = document.querySelector(".search-box");
            search.focus();
            search.select();
        });
        document.addEventListener("click", function (e) {
            if (e.target.id === "add-dialog") e.target.close();
        });
        document.addEventListener("showNotification", function (e) {
            const notif = document.getElementById("notification");
            notif.textContent = e.detail.value;
            notif.classList.add("show");
            setTimeout(() => notif.classList.remove("show"), 2500);
        });
    </script>
</head>

<body>
    <div class="sidebar">
        <form class="search-bar"
              hx-get="/"
              hx-target="album-results"
              hx-push-url="true">
            <input class="search-box"
                   type="search"
                   name="q"
                   placeholder="Search Albums"
                   autofocus
                   autocomplete="off"

                   value="{{ .SearchQuery }}"
                   hx-get="/"
                   hx-trigger="input changed delay:100ms, search"
                   hx-target="#album-results"
                   hx-replace-url="true">
            <button class="search-icon" type="submit"><img src="./static/search.png" alt=""></button>
        </form>

        <hr class="separator">
        <div id="album-results">
            {{ template "album-results" . }}
        </div>
        <div class="total-albums">{{ len .Albums }} Albums</div>
    </div>
    <div class="content" id="content">
        {{ template "content" . }}
    </div>
</body>
</html>
